name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-sqlite3 php-zip php-curl
      - name: Check source contains no operational data
        run: |
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          assert not any(n.startswith(('data/','uploads/')) and not n.endswith('/.htaccess') for n in names)
          PY
      - name: Tests on disposable databases
        run: python3 tests/run-all.py
      - name: Build package
        run: python3 tools/build-release.py "$RUNNER_TEMP/quiz-library-update.zip"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json,os
          assert os.environ['RELEASE_TAG']=='v'+json.load(open('version.json'))['version']
          PY
          python3 tools/build-release.py "$RUNNER_TEMP/quiz-library-update.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish-release.py "$RELEASE_TAG" "$RUNNER_TEMP/quiz-library-update.zip"
